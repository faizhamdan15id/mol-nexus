<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MOL-NEXUS | Bank Soal</title>

  <link
    rel="stylesheet"
    href="dashboard.css"
  >
</head>

<body>

  <header class="topbar">
    <div>
      <p class="eyebrow">MOL-NEXUS</p>

      <h1>Bank Soal</h1>

      <p class="subtitle">
        Question Management System
      </p>
    </div>

    <div class="system-status">
      <span class="status-dot"></span>
      TEACHER MODE
    </div>
  </header>

  <nav class="teacher-nav">
    <a href="dashboard.html" class="nav-link">
      📊 Dashboard
    </a>

    <a href="question-bank.html" class="nav-link active">
      📚 Bank Soal
    </a>

    <a href="formula-bank.html" class="nav-link">
      🧪 Bank Rumus
    </a>
  </nav>

  <main class="dashboard">

    <section class="panel">

      <div class="panel-heading">

  <div>
    <p class="section-label">
      QUESTION MANAGEMENT
    </p>

    <h2>Daftar Soal MOL-NEXUS</h2>
  </div>

  <button
    id="addQuestionButton"
    type="button"
  >
    + Tambah Soal
  </button>

</div>

      <div id="questionList">
        <p class="state-message">
          Memuat Bank Soal...
        </p>
      </div>

    </section>

  </main>
  <!-- QUESTION EDITOR MODAL -->
<div id="questionModal" class="formula-modal" hidden>

  <div class="formula-modal-card">

    <div class="formula-modal-header">
      <div>
        <p class="section-label">QUESTION EDITOR</p>
        <h2 id="questionModalTitle">Tambah Soal</h2>
      </div>

      <button
        id="closeQuestionModal"
        type="button"
        class="formula-modal-close"
      >
        ×
      </button>
    </div>

    <form id="questionForm">

      <input type="hidden" id="questionId">

      <label>
        Kode Soal
        <input
          id="questionCode"
          type="text"
          placeholder="Contoh: MN-GAS-003"
          required
        >
      </label>

      <label>
        Zona Nexus
        <select id="nexusZone" required>
          <option value="">Pilih Zona</option>
          <option value="MASS">MASS</option>
          <option value="PARTICLE">PARTICLE</option>
          <option value="GAS">GAS</option>
          <option value="SOLUTION">SOLUTION</option>
          <option value="STOICHIOMETRY">STOICHIOMETRY</option>
        </select>
      </label>

      <label>
        Tingkat Kesulitan
        <select id="questionDifficulty" required>
          <option value="">Pilih Level</option>
          <option value="EXPLORER">EXPLORER</option>
          <option value="CONNECTOR">CONNECTOR</option>
          <option value="NEXUS_MASTER">NEXUS MASTER</option>
        </select>
      </label>

      <label>
        Tipe Soal
        <select id="questionType" required>
          <option value="CASE">CASE</option>
          <option value="FINAL_NEXUS">FINAL NEXUS</option>
        </select>
      </label>

      <label>
        Soal
        <textarea
          id="questionText"
          rows="5"
          placeholder="Tuliskan soal..."
          required
        ></textarea>
      </label>

      <label>
        Konsep Asal
        <select id="originConceptQuestion" required>
          <option value="">Pilih Konsep</option>
          <option value="MASS">MASS</option>
          <option value="PARTICLE">PARTICLE</option>
          <option value="GAS">GAS</option>
          <option value="SOLUTION">SOLUTION</option>
          <option value="MOL">MOL</option>
        </select>
      </label>

      <label>
        Konsep Tujuan
        <select id="targetConceptQuestion" required>
          <option value="">Pilih Konsep</option>
          <option value="MASS">MASS</option>
          <option value="PARTICLE">PARTICLE</option>
          <option value="GAS">GAS</option>
          <option value="SOLUTION">SOLUTION</option>
          <option value="MOL">MOL</option>
        </select>
      </label>

      <label>
        Path Jawaban
        <input
          id="expectedPath"
          type="text"
          placeholder="Contoh: MASS, MOL, PARTICLE"
          required
        >
      </label>

     <label>
  Rumus / Langkah Formula
  <div id="formulaOptions">
    <p class="state-message">
      Memuat Bank Rumus...
    </p>
  </div>
 <div class="selected-formula-panel">
  <p class="selected-formula-title">
    Urutan Rumus Dipilih
  </p>

  <div id="selectedFormulaOrder">
    <p class="state-message">
      Belum ada rumus dipilih.
    </p>
  </div>
</div> 
</label> 

      <label>
        Jawaban Benar
        <input
          id="correctAnswer"
          type="number"
          step="any"
          placeholder="Contoh: 0.5"
          required
        >
      </label>

      <label>
        Toleransi Jawaban
        <input
          id="answerTolerance"
          type="number"
          step="any"
          value="0.001"
          required
        >
      </label>

      <label>
        Satuan
        <input
          id="correctUnit"
          type="text"
          placeholder="Contoh: mol"
          required
        >
      </label>

      <label>
        Numeracy Skill
        <select id="numeracySkill">
          <option value="">Pilih Kemampuan Numerasi</option>
          <option value="DIVISION">DIVISION</option>
          <option value="MULTIPLICATION">MULTIPLICATION</option>
          <option value="SCIENTIFIC_NOTATION">SCIENTIFIC NOTATION</option>
          <option value="UNIT_CONVERSION">UNIT CONVERSION</option>
          <option value="MULTI_STEP_STOICHIOMETRY">
            MULTI STEP STOICHIOMETRY
          </option>
        </select>
      </label>

      <label class="formula-checkbox">
        <input id="questionActive" type="checkbox" checked>
        Soal Aktif
      </label>

      <button type="submit" class="formula-save-button">
        Simpan Soal
      </button>

    </form>

  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="question-bank.js"></script>
</body>
</html>
