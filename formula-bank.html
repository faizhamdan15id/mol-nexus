<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MOL-NEXUS | Bank Rumus</title>

  <link
    rel="stylesheet"
    href="dashboard.css"
  >
</head>

<body>

  <header class="topbar">
    <div>
      <p class="eyebrow">MOL-NEXUS</p>

      <h1>Bank Rumus</h1>

      <p class="subtitle">
        Formula Management System
      </p>
    </div>

    <div class="system-status">
      <span class="status-dot"></span>
      TEACHER MODE
    </div>
  </header>

  <nav class="teacher-nav">
    <a href="dashboard.html" class="nav-link">
      📊 Dashboard
    </a>

    <a href="question-bank.html" class="nav-link">
      📚 Bank Soal
    </a>

    <a href="formula-bank.html" class="nav-link active">
      🧪 Bank Rumus
    </a>
  </nav>

  <main class="dashboard">

    <section class="panel">

      <div class="panel-heading">
        <div>
          <p class="section-label">
            FORMULA MANAGEMENT
          </p>

          <h2>Daftar Rumus MOL-NEXUS</h2>
        </div>
        <button
  id="addFormulaButton"
  class="game-action primary"
  type="button"
>
  + Tambah Rumus
        </button>
      </div>

      <div id="formulaList">
        <p class="state-message">
          Memuat Bank Rumus...
        </p>
      </div>

    </section>

  </main>
  <div id="formulaModal" class="formula-modal" hidden>

  <div class="formula-modal-card">

    <div class="formula-modal-header">
      <div>
        <p class="section-label">FORMULA EDITOR</p>
        <h2 id="formulaModalTitle">Tambah Rumus</h2>
      </div>

      <button
        id="closeFormulaModal"
        type="button"
        class="formula-modal-close"
      >
        ×
      </button>
    </div>

    <form id="formulaForm">

      <input type="hidden" id="formulaId">

      <label>
        Kode Rumus
        <input
          id="formulaCode"
          type="text"
          placeholder="Contoh: MOL_TO_GAS"
          required
        >
      </label>

      <label>
        Rumus
        <input
          id="formulaLabel"
          type="text"
          placeholder="Contoh: V = n × R × T / P"
          required
        >
      </label>

      <label>
        Konsep Asal
        <input
          id="originConcept"
          type="text"
          placeholder="Contoh: MOL"
          required
        >
      </label>

      <label>
        Konsep Tujuan
        <input
          id="targetConcept"
          type="text"
          placeholder="Contoh: GAS"
          required
        >
      </label>

      <label>
        Deskripsi
        <textarea
          id="formulaDescription"
          rows="3"
          placeholder="Keterangan penggunaan rumus"
        ></textarea>
      </label>

      <label class="formula-checkbox">
        <input
          id="formulaActive"
          type="checkbox"
          checked
        >
        Rumus Aktif
      </label>

      <button type="submit" class="formula-save-button">
        Simpan Rumus
      </button>

    </form>

  </div>

  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="formula-bank.js"></script>
</body>
</html>
